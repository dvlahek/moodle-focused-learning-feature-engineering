name: Synthetic-data smoke test

on:
  push:
  pull_request:

jobs:
  run-complete-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run synthetic-data workflow
        run: python run_all.py --quick

      - name: Confirm key outputs
        run: |
          test -s data_dummy/dummy_feature_dataset.csv
          test -s results_dummy/cv_regression_results.csv
          test -s results_dummy/cv_classification_results.csv
          test -s results_dummy/weather_permutation_test.csv
          test -s results_dummy/dummy_model_importance.png
